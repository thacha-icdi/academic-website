name: Update internship listings
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_internships.py'
      - 'scripts/test_internship_feed.py'
      - '.github/workflows/update-internships.yml'
permissions:
  contents: write
concurrency:
  group: internship-feed-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test internship filters
        run: python3 -m unittest discover -s scripts -p test_internship_feed.py -v
      - name: Fetch public employer feeds
        run: python3 scripts/update_internships.py
      - name: Save refreshed listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icdi-internship/data/internships.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh internship listings from employer feeds"
          git pull --rebase origin main
          git push origin HEAD:main
